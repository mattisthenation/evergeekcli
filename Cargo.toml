[package]
name = "evergeekcli"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI for searching and summarizing Evernote notes (read + search)."
license = "MIT"
authors = ["Matt Littlehale"]
repository = "https://github.com/mattisthenation/evergeekcli"
readme = "README.md"

[[bin]]
name = "evergeek"
path = "src/main.rs"

[lib]
name = "evergeekcli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thrift = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
thiserror = "1"
html2text = "0.12"
webbrowser = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
